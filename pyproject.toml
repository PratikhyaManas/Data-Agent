[project]
name = "data-agent"
version = "0.1.0"
description = "Multi-agent data analysis system with SQL, ETL, and visualization workflows."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain>=0.3.0",
    "langgraph>=0.2.0",
    "langchain-anthropic>=0.2.0",
    "anthropic>=0.40.0",
    "pandas>=2.2.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.2.3",
    "matplotlib>=3.8.0",
    "requests>=2.31.0",
]

[dependency-groups]
dev = [
    "bandit[toml]>=1.7.9",
    "semgrep>=1.78.0",
    "pip-audit>=2.7.3",
    "ruff>=0.6.0",
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
]

[tool.bandit]
# Scan our actual source; skip tests, data samples, and virtualenvs
exclude_dirs = ["tests", "data", ".venv", "venv", ".git"]

# B101 (assert used) is fine in this codebase's helper scripts; everything
# else stays at default severity. Do NOT skip B608 (SQL injection) or
# B301/B302 (pickle) - those are exactly the classes of bug this project
# needs to catch given it generates and executes SQL.
skips = ["B101"]

[tool.ruff]
line-length = 110
exclude = ["data", ".venv", "venv"]

[tool.ruff.lint]
# Keep it light for now: real errors + unused imports/vars, not full style nitpicking
select = ["E", "F", "W"]
ignore = ["E501"]  # line length handled by formatter/reviewer judgment, not a hard gate

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=utils --cov=agents --cov=Models --cov-report=term-missing"
