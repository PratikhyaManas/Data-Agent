<svg width="1200" height="260" viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Data Agent — Multi-Agent Data System">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="55%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="1200" height="260" rx="20" fill="url(#bg)"/>
  <circle cx="1030" cy="60" r="140" fill="url(#glow)"/>
  <circle cx="140" cy="220" r="120" fill="url(#glow)"/>

  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>
  <rect x="0" y="254" width="1200" height="6" fill="url(#accent)"/>

  <!-- Node graph motif -->
  <g stroke="#64748b" stroke-width="1.5" opacity="0.55">
    <line x1="905" y1="130" x2="985" y2="70"/>
    <line x1="905" y1="130" x2="985" y2="130"/>
    <line x1="905" y1="130" x2="985" y2="190"/>
  </g>
  <g>
    <circle cx="905" cy="130" r="14" fill="#0ea5e9"/>
    <circle cx="985" cy="70" r="9" fill="#a855f7"/>
    <circle cx="985" cy="130" r="9" fill="#22c55e"/>
    <circle cx="985" cy="190" r="9" fill="#f472b6"/>
  </g>

  <!-- Robot / agent glyph -->
  <g transform="translate(70,60)" filter="url(#soft)" opacity="0.25">
    <rect x="0" y="0" width="120" height="120" rx="24" fill="#38bdf8"/>
  </g>
  <g transform="translate(70,60)">
    <rect x="10" y="26" width="100" height="74" rx="18" fill="#0f172a" stroke="url(#accent)" stroke-width="3"/>
    <circle cx="42" cy="60" r="10" fill="#38bdf8"/>
    <circle cx="78" cy="60" r="10" fill="#a855f7"/>
    <rect x="34" y="82" width="52" height="8" rx="4" fill="#f472b6"/>
    <line x1="60" y1="26" x2="60" y2="6" stroke="url(#accent)" stroke-width="3"/>
    <circle cx="60" cy="4" r="5" fill="#f472b6"/>
    <rect x="-6" y="46" width="10" height="28" rx="5" fill="#a855f7"/>
    <rect x="116" y="46" width="10" height="28" rx="5" fill="#a855f7"/>
  </g>

  <text x="230" y="108" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="46" font-weight="700" fill="#f8fafc">
    Data Agent
  </text>
  <text x="230" y="144" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#94a3b8">
    Multi-Agent Data System · LangGraph + Claude
  </text>

  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600">
    <rect x="230" y="168" width="94" height="30" rx="15" fill="#0ea5e920"/>
    <text x="277" y="188" fill="#38bdf8" text-anchor="middle">SQL</text>

    <rect x="336" y="168" width="94" height="30" rx="15" fill="#22c55e20"/>
    <text x="383" y="188" fill="#4ade80" text-anchor="middle">ETL</text>

    <rect x="442" y="168" width="150" height="30" rx="15" fill="#a855f720"/>
    <text x="517" y="188" fill="#c084fc" text-anchor="middle">Visualization</text>

    <rect x="604" y="168" width="130" height="30" rx="15" fill="#f472b620"/>
    <text x="669" y="188" fill="#f472b6" text-anchor="middle">LLM-as-Judge</text>

    <rect x="746" y="168" width="110" height="30" rx="15" fill="#eab30820"/>
    <text x="801" y="188" fill="#facc15" text-anchor="middle">Catalog</text>

    <rect x="868" y="168" width="120" height="30" rx="15" fill="#06b6d420"/>
    <text x="928" y="188" fill="#22d3ee" text-anchor="middle">Scheduler</text>
  </g>
</svg>
